name: CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # The MainWindow GUI tests need a real display, so they are enabled
        # only on Linux, where xvfb-run can provide one.
        include:
          - os: ubuntu-latest
            gui_tests: 'ON'
          - os: windows-latest
            gui_tests: 'OFF'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRIDGELINE_GUI_TESTS=${{ matrix.gui_tests }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # Software GL keeps the GUI tests off the runner's absent hardware driver.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x900x24" ctest --test-dir build -C Release --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ridgeline-windows
          path: build/Release/**
          if-no-files-found: error
          retention-days: 14
