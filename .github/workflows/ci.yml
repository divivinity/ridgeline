name: CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
  # On-demand, so a run can be started without inventing a commit to push.
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # The MainWindow GUI tests need a real display, so they are enabled
        # only on Linux, where xvfb-run can provide one.
        include:
          - os: ubuntu-latest
            gui_tests: 'ON'
          - os: windows-latest
            gui_tests: 'OFF'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # Xvfb gives the MainWindow tests a display. GDAL is what enables the
      # GeoTIFF loader and its suite: without it that code is never compiled
      # and geotiff_tests is never registered, so the format had no automated
      # coverage on any platform.
      - name: Install Xvfb and GDAL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgdal-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRIDGELINE_GUI_TESTS=${{ matrix.gui_tests }}

      # find_package(GDAL QUIET) degrades silently: a missing or unusable GDAL
      # simply drops geotiff_tests and the run still goes green with a smaller
      # suite. Fail here instead, so losing that coverage is visible.
      - name: Verify GDAL-dependent tests are registered
        if: runner.os == 'Linux'
        run: |
          if ! ctest --test-dir build -N | grep -q geotiff_tests; then
            echo "::error::GDAL was expected on this runner but geotiff_tests is not registered."
            ctest --test-dir build -N
            exit 1
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      # Software GL keeps the GUI tests off the runner's absent hardware driver.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x900x24" ctest --test-dir build -C Release --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      # No artifact by design. This workflow answers "did this commit build and
      # pass?", and nothing here needs to be downloaded to know that. Packaging
      # lives in release.yml, which builds the full Windows bundle — terrain
      # included — and attaches it to a GitHub Release on a v* tag. Release
      # assets are permanent and do not count against the Actions storage quota,
      # which per-run artifacts do; uploading a distributable on every commit is
      # what exhausted it before.
